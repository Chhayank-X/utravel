<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UTravel - Explore Hotels</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="/src/hotels.js"></script>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="logo"><a href="index.html">UTravel<span class="dot">.</span></a></div>
      <div class="nav-links">
        <a href="index.html#destinations">Destinations</a>
        <a href="index.html#budget">Plan Budget</a>
        <a href="index.html#itinerary">Itinerary</a>
      </div>
    </nav>

    <!-- Header Section -->
    <section class="hotels-header" style="padding-top: 150px; padding-bottom: 50px; text-align: center; background: linear-gradient(to bottom, var(--bg-dark), var(--bg-card));">
      <div class="container">
        <h1 style="font-size: 3rem; margin-bottom: 20px;">Find Your Perfect Stay</h1>
        <p style="color: var(--text-secondary); max-width: 600px; margin: 0 auto 40px;">Discover the best luxury and budget accommodations handpicked for your next trip.</p>
        
        <!-- City Selector -->
        <div style="display: flex; justify-content: center; gap: 15px; margin-bottom: 20px;">
          <button class="tab-btn hotel-city-btn" data-city="mathura">Mathura</button>
          <button class="tab-btn hotel-city-btn" data-city="agra">Agra</button>
          <button class="tab-btn hotel-city-btn" data-city="delhi">Delhi</button>
        </div>
      </div>
    </section>

    <!-- Hotels Grid -->
    <section style="padding-top: 20px; min-height: 50vh;">
      <div class="container">
        <h2 id="hotel-city-title" style="margin-bottom: 30px; font-size: 1.8rem; color: var(--accent-gold);">Top Hotels in Mathura</h2>
        <div id="hotels-container" class="cards-grid">
          <!-- Dynamic hotel cards will be injected here -->
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <div class="container footer-content">
        <div class="footer-brand">
          <div class="logo">UTravel<span class="dot">.</span></div>
          <p>Your premium guide to incredible India.</p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 UTravel. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
